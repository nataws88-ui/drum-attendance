<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
  /* 첫 화면 전에: 저장된 테마 적용 + 초기 오류 수집 + 느린 부팅 안내 */
  (function () {
    try {
      var t = localStorage.getItem('da.theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
    var DA = window.DA = window.DA || {};
    DA.errors = DA.errors || [];
    DA._errHooked = true;
    function push(o) { o.at = new Date().toISOString(); DA.errors.push(o); if (DA.errors.length > 50) DA.errors.splice(0, DA.errors.length - 50); }
    window.addEventListener('error', function (ev) {
      var tg = ev && ev.target;
      if (tg && tg !== window && (tg.src || tg.href)) { push({ type: 'resource', message: '불러오기 실패: ' + (tg.src || tg.href) }); return; }
      push({ type: 'error', message: String(ev && ev.message || 'unknown'), source: ev && ev.filename || '', line: ev && ev.lineno || 0, col: ev && ev.colno || 0, stack: ev && ev.error && ev.error.stack ? String(ev.error.stack).slice(0, 2000) : '' });
    }, true);
    window.addEventListener('unhandledrejection', function (ev) {
      var r = ev && ev.reason;
      push({ type: 'unhandledrejection', message: String(r && r.message || r), stack: r && r.stack ? String(r.stack).slice(0, 2000) : '' });
    });
    setTimeout(function () {
      if (!DA.booted) { var b = document.getElementById('boot'); if (b && !b.querySelector('.fatal')) b.className += ' slow'; }
    }, 7000);
  })();
</script>

<div id="boot" class="boot" role="status" aria-label="불러오는 중">
  <img class="boot-logo" src="icons/icon.svg" width="88" height="88" alt="">
  <div class="boot-name">드럼 출석부</div>

  <div class="boot-help">
    불러오는 데 시간이 오래 걸리고 있어요.<br>
    <button class="btn btn-primary" type="button" onclick="location.reload()">다시 열기</button>
